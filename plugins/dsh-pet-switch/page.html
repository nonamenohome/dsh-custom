<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桌宠总开关 · DSH</title>
<style>
  :root {
    --bg: #0e1116; --card: #161b22; --line: #26303c; --text: #e6edf3;
    --dim: #8b98a5; --accent: #4d9ef7; --ok: #3fb950; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 18px 56px; background: var(--bg); color: var(--text);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--dim); margin: 0 0 22px; font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row { display: flex; gap: 14px; padding: 16px 18px; border-top: 1px solid var(--line); align-items: flex-start; }
  .row:first-child { border-top: 0; }
  .row:hover { background: #1a212a; }
  input[type=checkbox] { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); flex: none; cursor: pointer; }
  .meta { flex: 1; min-width: 0; }
  .name { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pkg { color: var(--dim); font: 12px ui-monospace, Consolas, monospace; }
  .desc { color: var(--dim); font-size: 12.5px; margin-top: 3px; }
  .chip { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .chip.on { color: var(--ok); border-color: #1f4d2a; background: #0f2417; }
  .bar { display: flex; align-items: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  button {
    background: var(--accent); color: #06121f; border: 0; border-radius: 9px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); font-weight: 500; }
  .hint { color: var(--dim); font-size: 12.5px; }
  .status { margin-top: 14px; font-size: 13px; min-height: 22px; }
  .status.ok { color: var(--ok); }
  .status.err { color: #f85149; }
  details { margin-top: 22px; color: var(--dim); font-size: 12.5px; }
  summary { cursor: pointer; }
  code { font: 12px ui-monospace, Consolas, monospace; color: #b7c4d2; word-break: break-all; }
  .foot { margin-top: 26px; color: var(--dim); font-size: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>桌宠总开关</h1>
  <p class="sub">勾选要参与启动的桌宠。改动写入当前 profile 的 <code>dsh.profile.bundles</code>，<strong>完全退出 DSH 再重开</strong>才生效。</p>

  <div class="card" id="list"><div class="row"><span class="hint">正在读取…</span></div></div>

  <div class="bar">
    <button id="save" disabled>保存并应用</button>
    <button class="ghost" id="reload">重新读取</button>
    <span class="hint" id="profileHint"></span>
  </div>
  <div class="status" id="status"></div>

  <details>
    <summary>这个页面会改哪些东西？</summary>
    <p>只改 <code>dsh.profile.bundles</code> 里属于桌宠的那几行，其它插件（皮肤、开机动画、目录、QQ 桥等）原样保留、顺序不动。每次写入前会把原文件备份到 <code>~/.dsh/pet-switch/backups/</code>。</p>
    <p id="others"></p>
  </details>

  <div class="foot">
    由插件 <code>dsh-pet-switch</code> 提供 · 只监听 127.0.0.1 · 端口冲突会自动顺延，实际地址见 <code>~/.dsh/pet-switch/url.txt</code>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let state = null;

function render() {
  const list = $('list');
  list.innerHTML = '';
  for (const p of state.pets) {
    const row = document.createElement('label');
    row.className = 'row';
    row.innerHTML = `
      <input type="checkbox" data-id="${p.id}" ${p.enabled ? 'checked' : ''}>
      <span class="meta">
        <span class="name">${p.name}
          <span class="chip ${p.enabled ? 'on' : ''}" data-chip="${p.id}">${p.enabled ? '已启用' : '未启用'}</span>
        </span>
        <span class="pkg">${p.pkg}</span>
        <span class="desc">${p.desc}</span>
      </span>`;
    list.appendChild(row);
  }
  list.querySelectorAll('input[type=checkbox]').forEach((el) => {
    el.addEventListener('change', () => {
      const chip = list.querySelector(`[data-chip="${el.dataset.id}"]`);
      if (chip) {
        chip.textContent = el.checked ? '已启用' : '未启用';
        chip.className = 'chip' + (el.checked ? ' on' : '');
      }
    });
  });
  $('profileHint').textContent = 'profile：' + state.profile;
  $('others').textContent = '保持不动的条目：' + (state.others || []).join('、');
  $('save').disabled = false;
}

async function load() {
  $('status').textContent = '';
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    state = await r.json();
    if (!state.ok) throw new Error(state.error || '读取失败');
    render();
  } catch (e) {
    $('list').innerHTML = '<div class="row"><span class="hint">读取失败：' + e.message + '</span></div>';
    $('status').textContent = '读取失败：' + e.message;
    $('status').className = 'status err';
  }
}

$('save').addEventListener('click', async () => {
  const enabled = [...document.querySelectorAll('input[type=checkbox]')].filter((el) => el.checked).map((el) => el.dataset.id);
  $('save').disabled = true;
  $('status').className = 'status';
  $('status').textContent = '写入中…';
  try {
    const r = await fetch('/api/apply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled }),
    });
    const out = await r.json();
    if (!out.ok) throw new Error(out.error || '写入失败');
    $('status').className = 'status ok';
    $('status').textContent = '已写入 ' + out.profile + ' profile。现在完全退出 DSH（含托盘）再重开，改动才生效。';
    await load();
  } catch (e) {
    $('status').className = 'status err';
    $('status').textContent = '写入失败：' + e.message;
  } finally {
    $('save').disabled = false;
  }
});

$('reload').addEventListener('click', load);
load();
</script>
</body>
</html>
